title: 科学研究中的机器学习方法
title_prefix: 科学研究中的
title_main: 机器学习方法
instructor: 杨智勇
institution: 中国科学院大学
# PDFs in this directory are discovered at build time; see _docs/teaching-resources.md.
resource_directory: assets/teaching
# Course copy follows 第一章绪论, pages 3–5, 7, 10 and 91.
features:
  - id: mathematics
    title: 数学基础串讲
    linear_algebra: 从几何直观入手，了解向量与矩阵的基本操作
    linear_detail: 详细讲解矩阵导数
    probability: 概率论背后的哲思和原理
    source_page: 4
  - id: minimum
    title: 理论极小值
    # Highlighted words match 第一章绪论, page 5; CSS uses the course palette.
    quote_segments:
      - text: "For me, the theoretical minimum means just what you need to know in order to proceed to the next level. It means "
      - text: "not"
        color: red
      - text: " fat encyclopedic textbooks that explains "
      - text: "everything"
        color: red
      - text: ", "
      - text: "but"
        color: blue
      - text: " thin books that explain "
      - text: "everything important"
        color: blue
    attribution: Susskind
    source_page: 5
  - id: science
    title: AI+SCI
    introduction: AI&SCI已形成有机闭环，SCI早已对AI产生了深远的影响
    ai4s: 随课程简单串讲经典的例子
    s4ai: 在神经网络、生成模型中进行介绍
    examples:
      - title: 神经科学与神经网络
        text: 神经系统的电信号传递机制启发了现代人工神经网络及深度学习
      - title: 统计物理与生成模型
        text: 统计物理理论对早期生成模型产生了深远影响
    source_page: 7
goals:
  - id: computing
    audience: 计算机相关专业
    text: 弄懂底层公式和原理，多做习题，在自己的工作能够灵活的对其进行扩展、延伸
  - id: other
    audience: 非计算机相关
    text: 重点掌握机器学习中的不同任务，每种任务相关的算法，公式记住结果，能够将科研工作中遇到的问题转换成一个机器学习问题，并且找到相关解法即可
modules:
  - id: foundations
    title: 基础知识
    chapters:
      - number: "01"
        title: 绪论
        subtitle: 本课程缩影
        outline_title: 绪论
        description: 介绍课程的主要内容与学习目标。
      - number: "02"
        title: 线性代数复习
        outline_title: 线性代数复习
        description: 从几何直观理解向量与矩阵的基本操作，学习矩阵导数。
      - number: "03"
        title: 概率统计复习
        outline_title: 概率统计复习
        description: 介绍概率与统计的基本概念，理解其背后的哲思和原理。
  - id: supervised
    title: 有监督学习基础理论
    chapters:
      - number: "04"
        title: 回归
        outline_title: 回归
        description: 介绍回归任务的建模方法与基本原理。
      - number: "05"
        title: 分类
        outline_title: 分类
        description: 介绍分类任务的建模方法与基本原理。
  - id: models
    title: 深度学习简介
    chapters:
      - number: "06"
        title: 深度神经网络
        outline_title: 深度神经网络
        parts:
          - title: 基础篇
            description: 介绍 MLP 基础模型与 BP 算法。
          - title: 进阶篇
            description: 介绍高维数据、时序数据和图数据对应的深度学习方法，以及表格大模型与物理启发模型。
  - id: strategies
    title: 有监督学习进阶原理
    chapters:
      - number: "07"
        title: 间隔理论
        outline_title: 间隔理论
        description: 介绍间隔理论及其在学习算法中的作用。
      - number: "08"
        title: 模型集成
        outline_title: 模型集成
        description: 介绍模型集成的基本思想与方法。
  - id: unsupervised
    title: 无监督学习中的原理
    chapters:
      - number: "09"
        title: 聚类
        outline_title: 聚类
        description: 介绍聚类任务的基本思想与方法。
      - number: "10"
        title: 表征、重构及生成模型
        outline_title: 表征、重构及生成模型
        description: 介绍数据表征、重构与生成模型的基本原理。
# Each chapter supports multiple files in all categories, including automatically discovered PDFs.
# Explicit resources above remain available for custom titles or files outside resource_directory.
resource_types:
  - id: slides
    title: 课件
  - id: board_notes
    title: 板书
  - id: additional_materials
    title: 附加材料
