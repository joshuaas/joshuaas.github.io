<svg class="module-art module-art-{{ include.module }}" viewBox="0 0 480 400" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
  <defs><linearGradient id="module-{{ include.module }}-ink" x1="50" y1="50" x2="420" y2="350" gradientUnits="userSpaceOnUse"><stop stop-color="#d9edff"/><stop offset=".45" stop-color="#71b4ec"/><stop offset="1" stop-color="#1268b5"/></linearGradient></defs>
  {% if include.module == 'foundations' %}
  <path d="M30 245 240 120 450 245 240 370Z" fill="#eaf4fc" stroke="#bed6eb"/>
  <g class="basis-plane" stroke="#bed6eb"><path d="M30 180 240 55 450 180 240 305Z" fill="#d4e9fa" fill-opacity=".6"/><path d="M80 150 290 275M135 117 345 242M185 86 395 210M80 210 290 85M135 242 345 117M185 274 395 148"/></g>
  <path class="basis-vector" d="M95 230 350 80m-25 4 25-4-9 24" stroke="#257ac1" stroke-width="5" stroke-linecap="round"/>
  {% elsif include.module == 'supervised' %}
  <path d="M50 330V60m0 270h390" stroke="#abc9e1" stroke-width="3"/>
  <path class="fit-curve" pathLength="1" d="M65 300C130 275 155 190 245 195S365 105 430 60" stroke="url(#module-{{ include.module }}-ink)" stroke-width="9" stroke-linecap="round"/>
  <g class="fit-points" fill="#3d92d7"><circle cx="100" cy="275" r="8"/><circle cx="156" cy="218" r="8"/><circle cx="216" cy="224" r="8"/><circle cx="278" cy="162" r="8"/><circle cx="346" cy="139" r="8"/><circle cx="392" cy="90" r="8"/></g>
  {% elsif include.module == 'models' %}
  <g stroke="#a9cce9" stroke-width="2"><path d="M65 120 185 70 305 120 425 160M65 120 185 160 305 215 425 260M65 120 185 250 305 310 425 260M65 230 185 70 305 215 425 160M65 230 185 160 305 310 425 260M65 230 185 250 305 120 425 260M65 340 185 70 305 310 425 160M65 340 185 160 305 120 425 160M65 340 185 250 305 215 425 260"/></g>
  <g class="network-signals" stroke="#187ac6" stroke-width="4" stroke-linecap="round"><path pathLength="100" d="M65 120 185 70 305 120 425 160"/><path pathLength="100" d="M65 120 185 160 305 215 425 260"/><path pathLength="100" d="M65 340 185 250 305 215 425 260"/></g>
  <g fill="url(#module-{{ include.module }}-ink)" stroke="#f7fbff" stroke-width="4">
    <g class="network-layer layer-input"><circle cx="65" cy="120" r="19"/><circle cx="65" cy="230" r="19"/><circle cx="65" cy="340" r="19"/></g>
    <g class="network-layer layer-hidden-one"><circle cx="185" cy="70" r="23"/><circle cx="185" cy="160" r="23"/><circle cx="185" cy="250" r="23"/></g>
    <g class="network-layer layer-hidden-two"><circle cx="305" cy="120" r="23"/><circle cx="305" cy="215" r="23"/><circle cx="305" cy="310" r="23"/></g>
    <g class="network-layer layer-output"><circle cx="425" cy="160" r="27"/><circle cx="425" cy="260" r="27"/></g>
  </g>
  {% elsif include.module == 'strategies' %}
  <g stroke="#a4cae9" stroke-width="2" stroke-dasharray="8 7"><path class="margin-upper" d="M50 300 375 70" transform="translate(-40 -40)"/><path class="margin-lower" d="M50 300 375 70" transform="translate(40 40)"/></g>
  <path class="margin-boundary" d="M50 300 375 70" stroke="url(#module-{{ include.module }}-ink)" stroke-width="6"/>
  <g fill="#63a9de"><circle cx="98" cy="178" r="13"/><circle cx="180" cy="90" r="13"/><circle cx="278" cy="90" r="13"/></g><g fill="#b6d5ec"><circle cx="198" cy="300" r="13"/><circle cx="338" cy="222" r="13"/><circle cx="395" cy="200" r="13"/></g>
  {% else %}
  <g class="cluster-regions" fill="#c7e2f6"><circle cx="112" cy="120" r="53"/><circle cx="350" cy="125" r="66"/><circle cx="248" cy="298" r="65"/></g>
  <g class="cluster-points" fill="#2b86cd">
    <circle cx="80" cy="110" r="10" style="--cluster-x:-30px;--cluster-y:70px"/><circle cx="117" cy="85" r="10" style="--cluster-x:80px;--cluster-y:-40px"/><circle cx="140" cy="123" r="10" style="--cluster-x:90px;--cluster-y:60px"/><circle cx="105" cy="143" r="10" style="--cluster-x:-30px;--cluster-y:90px"/>
    <circle cx="322" cy="110" r="10" style="--cluster-x:-50px;--cluster-y:-50px"/><circle cx="350" cy="87" r="10" style="--cluster-x:80px;--cluster-y:20px"/><circle cx="390" cy="120" r="10" style="--cluster-x:0px;--cluster-y:100px"/><circle cx="359" cy="150" r="10" style="--cluster-x:-80px;--cluster-y:60px"/>
    <circle cx="217" cy="280" r="10" style="--cluster-x:-110px;--cluster-y:20px"/><circle cx="255" cy="255" r="10" style="--cluster-x:0px;--cluster-y:-90px"/><circle cx="276" cy="290" r="10" style="--cluster-x:110px;--cluster-y:30px"/><circle cx="238" cy="329" r="10" style="--cluster-x:-20px;--cluster-y:25px"/>
  </g>
  {% endif %}
</svg>
